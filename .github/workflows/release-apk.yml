name: Release APK

# Push a tag like v1.0.0 to build signed release APKs and attach them to a
# GitHub Release. Also runnable by hand (uploads APKs as a build artifact).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the Release + upload assets
  packages: read # install @kagehq/* from GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest # Linux NDK — avoids the macOS clang issues
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # @kagehq/shared lives in GitHub Packages; authenticate with the workflow
      # token (needs packages: read, granted above).
      - name: Configure GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "@kagehq:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
            echo "node-linker=hoisted"
          } > .npmrc

      - name: Install dependencies
        # not frozen: package.json pins @kagehq/shared ^1.2.0 but the committed
        # lockfile can't be refreshed locally (dev token expired), so let CI
        # re-resolve. Revert to --frozen-lockfile once the lockfile is updated.
        run: pnpm install --no-frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild -p android --no-install

      - name: Inject release signing + ABI splits
        run: node scripts/configure-android-release.js

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore

      - name: Build signed release APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.enableProguardInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kage-release-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
